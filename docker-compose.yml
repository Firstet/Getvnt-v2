version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: getvnt-app
    restart: always
    expose:
      - "80"
    ports:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.getvnt-http.rule=Host(`getvnt-x9t6pu-92d7c6-169-58-52-97.sslip.io`) || Host(`getvnt-getvnt20-ymzioo-a4b7d0-169-58-52-97.sslip.io`)"
      - "traefik.http.routers.getvnt-http.entrypoints=web"
      - "traefik.http.routers.getvnt-http.service=getvnt-service"
      - "traefik.http.routers.getvnt-https.rule=Host(`getvnt-x9t6pu-92d7c6-169-58-52-97.sslip.io`) || Host(`getvnt-getvnt20-ymzioo-a4b7d0-169-58-52-97.sslip.io`)"
      - "traefik.http.routers.getvnt-https.entrypoints=websecure"
      - "traefik.http.routers.getvnt-https.service=getvnt-service"
      - "traefik.http.services.getvnt-service.loadbalancer.server.port=80"
    environment:
      - APP_NAME=Getvnt
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true
